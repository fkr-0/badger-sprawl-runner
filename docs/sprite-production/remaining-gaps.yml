version: 1
purpose: >-
  Structured completion catalog for Badger Sprawl Runner animation, interactive-tile,
  boss-action, NPC/companion, enemy-state, and VFX gaps that are not represented by
  the current runtime atlas rows or the broader full-scope expansion templates.
metadata_contract:
  required:
    - atlas_family
    - animation_state
    - animation_class
    - runtime_clip
    - source_class
    - frames
    - action
  review_state: pending_render

