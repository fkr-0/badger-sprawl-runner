type_mismatches:

  - id: TM-001
    severity: HIGH
    status: RESOLVED 2026-06-04
    title: "EnemySystem.step() signature does not include platforms"
    file: apps/runner/src/systems/EnemySystem.ts line 17 vs HordeScene.ts line 87
    detail: |
      RESOLVED: EnemySystem.step() now has a scene-compatible overload for
      step(enemies, player, platforms, dt) and applies platform collision for
      non-drone enemies using platformer-core gravityStep/platformStep.
    fix: |
      Implemented in EnemySystem.ts. Covered by EnemySystem.test.ts regression
      verifying an enemy lands on passed platforms and zeros vertical velocity.

  - id: TM-002
    severity: MEDIUM
    status: RESOLVED 2026-06-04
    title: "SceneContext.renderer is 'unknown' but scenes need concrete Renderer"
    file: apps/runner/src/engine/SceneManager.ts line 18
    detail: |
      RESOLVED: SceneContext.renderer is a required concrete Renderer and scene
      render signatures accept Renderer directly.
    fix: |
      Implemented in SceneManager.ts and scene files. Covered by SceneManager.test.ts.

  - id: TM-003
    severity: MEDIUM
    title: "WaveDirector.spawnQueue uses cumulative delay but step() uses delta comparison"
    file: apps/runner/src/systems/WaveDirector.ts lines 85-109
    detail: |
      Spawn delays are random 0-2 seconds each. step() checks `this.spawnTimer >= this.spawnQueue[0].delay`.
      But spawnTimer resets to 0 after each spawn (line 108), so the delay is per-spawn.
      The `spawnDelay` field on WaveConfig (line 13) is never used.
      Also `pointIndex` (line 53) is incremented but never used for spawn positions.
    fix: |
      Use spawn points from getEnemySpawnPoints() for positioning.
      Either use cumulative delays or per-spawn delays consistently.

  - id: TM-004
    severity: LOW
    title: "WaveConfig interface defined but never used"
    file: apps/runner/src/systems/WaveDirector.ts lines 9-14
    detail: |
      WaveConfig has waveNumber, budget, enemies, spawnDelay — none of these are referenced.
      Wave budgets are hardcoded in waveBudgets array.
    fix: |
      Use WaveConfig to parameterize waves or remove the dead interface.

  - id: TM-005
    severity: MEDIUM
    status: RESOLVED 2026-06-04
    title: "CombatSystem.step() actionMap signature mismatch with InputSystem"
    file: apps/runner/src/systems/CombatSystem.ts line 186
    detail: |
      RESOLVED: CombatSystem.step() now uses the shared ActionMap type from
      InputSystem, matching HordeScene's InputSystem.snapshot() call site.
    fix: |
      Implemented in CombatSystem.ts and verified by targeted strict tsc over
      HordeScene integration files.

  - id: TM-006
    severity: MEDIUM
    title: "processMossInput called with CombatSystem instance instead of expected interface"
    file: apps/runner/src/scenes/HordeScene.ts line 84
    detail: |
      `processMossInput(this.player, action, dt, this.combat)` — need to verify
      MossBadger.ts's processMossInput signature matches this usage.
    fix: |
      Verify and align signatures.

