# =============================================================================
# SECTION 8: ARCHITECTURE & CODE QUALITY ISSUES
# =============================================================================

architecture:

  - id: AR-001
    title: "Legacy main.js alongside main.ts — entry point confusion"
    detail: |
      src/main.js and apps/runner/src/main.js exist as legacy JS files.
      apps/runner/src/main.ts is the TypeScript entry. The JS files should be removed.

  - id: AR-002
    title: "Duplicate src/ at project root"
    detail: |
      src/main.js and src/game.css exist at project root, duplicating apps/runner/src/.
      These appear to be from the original prototype before monorepo extraction.

  - id: AR-003
    title: "No unified event type system"
    detail: |
      EventBus.ts is a simple string-keyed emitter. CombatSystem has its own
      CombatEvent types. GameFlow has story events. No unified event taxonomy.
      This will cause coupling issues as systems grow.

  - id: AR-004
    title: "WeakMap for melee combo state is fragile"
    detail: |
      CombatSystem uses `WeakMap<CombatEntity, MeleeComboSystem>` for combo state.
      Since CombatEntity objects are plain objects (not class instances), they may
      be garbage collected unexpectedly if no other reference exists.

  - id: AR-005
    title: "Platformer-core physics not used by app"
    detail: |
      packages/platformer-core has well-tested physics functions.
      apps/runner/src/systems/PhysicsSystem.ts has its own implementation.
      The extracted package is not imported by the app — duplication.

  - id: AR-006
    title: "Excessive console.log in production code"
    detail: |
      WaveDirector: console.log on wave start/complete (lines 59, 118)
      HordeScene: console.log on enter/exit (lines 44, 54)
      EnemyFactory: console.warn on unknown enemy (line 77)
      These should use a proper logging system or be behind DebugFlags.

