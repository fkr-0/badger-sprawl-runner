logic_bugs:

  - id: LB-001
    severity: HIGH
    status: RESOLVED 2026-06-04
    title: "platformStep.ts uses hardcoded 0.016 dt for prevY calculation"
    file: packages/platformer-core/src/systems/platformStep.ts
    detail: |
      RESOLVED: PlatformStepInput now carries the caller's actual dt and
      platformStep computes previous Y with `prevY = y - prevVy * dt`.
      PhysicsSystem and physicsWorldStep pass their real step dt.
    fix: |
      Implemented in packages/platformer-core/src/systems/platformStep.ts and
      callers. Covered by a 30fps landing regression in physics.test.ts plus
      physics-world-step regression coverage.

  - id: LB-002
    severity: MEDIUM
    title: "WaveDirector enqueues enemies but never uses spawn points for positioning"
    file: apps/runner/src/systems/WaveDirector.ts lines 40, 88-106
    detail: |
      getEnemySpawnPoints() is called (line 40) but the result is only used for pointIndex counting.
      Actual spawn position (line 104) is `playerX + 400 + Math.random() * 200` — always ahead of player.
      Spawn points array is never indexed.
    fix: |
      Use spawnPoints[pointIndex % spawnPoints.length] for actual x position.

  - id: LB-003
    severity: MEDIUM
    title: "HordeScene uses Math.random() for platform generation — non-deterministic"
    file: apps/runner/src/scenes/HordeScene.ts lines 221-228
    detail: |
      initArena() uses Math.random() for platform width. This makes the arena
      different every time, breaking replay/restart consistency.
    fix: |
      Use a seeded PRNG or fixed platform definitions.

  - id: LB-004
    severity: LOW
    title: "CombatSystem.damage() sets invuln to 1.1s — extremely long"
    file: apps/runner/src/systems/CombatSystem.ts line 442
    detail: |
      After taking damage, player gets 1.1 seconds of invulnerability. This is very long
      for a fast-paced platformer and makes the game feel sluggish.
    fix: |
      Reduce to 0.3-0.5s or make it configurable.

  - id: LB-005
    severity: LOW
    title: "flyingObjectStep.ts fluid viscosity can over-damp velocity"
    file: packages/platformer-core/src/systems/flyingObjectStep.ts
    detail: |
      If `fluid.viscosity * fluid.density * dt > 1`, the multiplier goes negative,
      reversing velocity instead of damping it.
    fix: |
      Clamp: `Math.max(0, 1 - fluid.viscosity * fluid.density * dt)`

